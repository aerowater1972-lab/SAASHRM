version: '3.9'

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flexy_hrms
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
