name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'  # Daily 03:00 UTC

jobs:
  backend:
    name: Backend (lint, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint -w apps/api

      - name: Unit tests
        run: npm test -w apps/api

      - name: Build backend
        run: npm run build -w apps/api

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w apps/web

  contract:
    name: Frontend-Backend API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check API contract
        run: npm run contract

  e2e:
    name: Backend E2E (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flexy_hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexy_hrms?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-chars-long-0001
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars-1
      DATA_ENCRYPTION_KEY: ci-encryption-key-min-32-chars-long-1
      ALLOW_PUBLIC_REGISTER: "true"
      SENTRY_DSN: disabled
      OTEL_EXPORTER_OTLP_ENDPOINT: disabled
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=packages/database/schema.prisma

      - name: Seed database
        run: npm run db:seed

      - name: Run e2e tests
        run: npm run test:e2e -w apps/api

  web-e2e:
    name: Web E2E (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flexy_hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexy_hrms?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-chars-long-0001
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars-1
      DATA_ENCRYPTION_KEY: ci-encryption-key-min-32-chars-long-1
      ALLOW_PUBLIC_REGISTER: "true"
      SENTRY_DSN: disabled
      OTEL_EXPORTER_OTLP_ENDPOINT: disabled
      NEXT_PUBLIC_API_BASE: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=packages/database/schema.prisma

      - name: Seed database (base + demo tenant)
        run: |
          npm run db:seed
          npx ts-node --transpile-only packages/database/seed-demo-nusantara.ts

      - name: Build API and web
        run: |
          npm run build -w apps/api
          npm run build -w apps/web

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start API and web
        run: |
          (node apps/api/dist/main > /tmp/api.log 2>&1 &)
          (npx next start apps/web -p 3001 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/v1/health && curl -sf http://localhost:3001/login && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/health
          curl -sf http://localhost:3001/login

      - name: Run Playwright tests
        run: npm run test:e2e -w apps/web

  k6-nightly:
    name: Load Test (k6 nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flexy_hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexy_hrms?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-chars-long-0001
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars-1
      DATA_ENCRYPTION_KEY: ci-encryption-key-min-32-chars-long-1
      ALLOW_PUBLIC_REGISTER: "true"
      SENTRY_DSN: disabled
      OTEL_EXPORTER_OTLP_ENDPOINT: disabled
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=packages/database/schema.prisma

      - name: Seed database
        run: npm run db:seed

      - name: Build API
        run: npm run build -w apps/api

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start API
        run: |
          node apps/api/dist/main > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 2
          done

      - name: Run k6 smoke test
        run: k6 run k6-smoke.js
        env:
          K6_WEB_DASHBOARD: true

  backup-restore:
    name: Backup/Restore Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flexy_hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexy_hrms?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-chars-long-0001
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars-1
      DATA_ENCRYPTION_KEY: ci-encryption-key-min-32-chars-long-1
      ALLOW_PUBLIC_REGISTER: "true"
      SENTRY_DSN: disabled
      OTEL_EXPORTER_OTLP_ENDPOINT: disabled
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=packages/database/schema.prisma

      - name: Seed database
        run: npm run db:seed

      - name: Build API
        run: npm run build -w apps/api

      - name: Run backup script
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh ./backups
        env:
          BACKUP_RETENTION_DAYS: 0

      - name: Verify backup file exists
        run: |
          ls -la ./backups/
          BACKUP_FILE=$(ls -t ./backups/flexy_hrms_*.dump | head -1)
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

      - name: Create fresh database for restore test
        run: |
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS flexy_hrms_restore;"
          psql -h localhost -U postgres -c "CREATE DATABASE flexy_hrms_restore;"

      - name: Restore to fresh database
        run: |
          chmod +x scripts/restore.sh
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/flexy_hrms_restore?schema=public" \
          ./scripts/restore.sh --force "$BACKUP_FILE"

      - name: Verify restored data integrity
        run: |
          psql -h localhost -U postgres -d flexy_hrms_restore -c "SELECT count(*) FROM \"User\";"
          psql -h localhost -U postgres -d flexy_hrms_restore -c "SELECT count(*) FROM \"Employee\";"
          psql -h localhost -U postgres -d flexy_hrms_restore -c "SELECT count(*) FROM \"Employment\";"
